[alembic]
script_location = alembic
prepend_sys_path = .
# The actual URL is injected by alembic/env.py from app settings.
# Keep this file ASCII-only: Alembic reads it using the system locale encoding,
# which is GBK on Chinese Windows and would fail on UTF-8 comments.
sqlalchemy.url = sqlite:///./deepvision.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
